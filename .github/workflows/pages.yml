name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install + Build (inside PRO_WEBSITE)
        id: build
        shell: bash
        run: |
          set -euo pipefail

          DIR="PRO_WEBSITE"
          if [ ! -f "$DIR/package.json" ]; then
            echo "ERROR: $DIR/package.json not found. Ensure your Next.js project is inside PRO_WEBSITE/."
            exit 1
          fi

          cd "$DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          # Prefer export script if present, otherwise build
          if npm run | grep -qE '^  export'; then
            npm run export
          else
            npm run build
          fi

          cd -

          # Prefer Next export output
          if [ -d "$DIR/out" ]; then
            echo "path=$DIR/out" >> "$GITHUB_OUTPUT"
          elif [ -d "$DIR/dist" ]; then
            echo "path=$DIR/dist" >> "$GITHUB_OUTPUT"
          elif [ -d "$DIR/build" ]; then
            echo "path=$DIR/build" >> "$GITHUB_OUTPUT"
          else
            echo "path=$DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
