name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build (Next.js / Node if present, otherwise static)
        id: build
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            echo "Node project detected"

            # Prefer clean install for CI
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            # Try common build scripts safely
            if npm run | grep -qE '^  export'; then
              npm run export
            elif npm run | grep -qE '^  build'; then
              npm run build
            else
              echo "No build/export script found, skipping build step"
            fi
          else
            echo "Static site detected (no package.json)"
          fi

          # Detect output directory in priority order
          if [ -d out ]; then
            echo "path=out" >> "$GITHUB_OUTPUT"
          elif [ -d dist ]; then
            echo "path=dist" >> "$GITHUB_OUTPUT"
          elif [ -d build ]; then
            echo "path=build" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
